name: 'Kisonar POC CI - manual'

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to which make the terraform deployment'
        required: true
        default: dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: GitHub checkout action
        uses: actions/checkout@v6
      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '26'
      - name: Print Java version
        run: java --version
      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.0
      - name: Print Gradle version
        run: gradle --version
      - name: Execute Gradle build
        run: gradle clean build
      - name: Print target environment
        run: Selected environment {{ inputs.target_env }}"